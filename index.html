    <script>
      // The small bootstrap module can itself fail before its retry UI is wired.
      window.addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
        function showRetry() {
          var splash = document.getElementById('game-startup');
          if (!splash) return;
          splash.querySelector('[role=status]').textContent = '启动文件加载失败';
          var retry = splash.querySelector('button');
          retry.hidden = false;
          retry.onclick = function () { location.reload(); };
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showRetry, { once: true });
        else showRetry();
      }, true);
    </script>
    <style>
      #game-startup {
        position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
        margin: 0; padding: 24px; box-sizing: border-box; color: #ece7d8; text-align: center;
        background: radial-gradient(ellipse at 38% 32%, #244c40 0%, #112f27 48%, #071a16 100%);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-variant-numeric: tabular-nums;
      }
      #game-startup section { width: min(100%, 350px); }
      #game-startup h1 {
        margin: 0 0 32px; color: #f4daa0; font: 700 clamp(34px, 6vw, 52px)/1.2 "Noto Serif SC", SimSun, serif;
        letter-spacing: .14em; text-indent: .14em;
      }
      #game-startup progress { display: block; width: 100%; height: 6px; overflow: hidden;
        appearance: none; border: 0; border-radius: 9px; background: #081c17; color: #e7c779; }
      #game-startup progress::-webkit-progress-bar { background: #081c17; border-radius: 9px; }
      #game-startup progress::-webkit-progress-value { background: linear-gradient(90deg,#b99a5b,#f6da95); border-radius: 9px; }
      #game-startup progress::-moz-progress-bar { background: #e7c779; border-radius: 9px; }
      #game-startup p { margin: 16px 0 0; font-size: 15px; line-height: 1.5; }
      #game-startup small { display: block; min-height: 1.5em; margin-top: 4px; color: #b0c2b9; font-size: 13px; overflow-wrap: anywhere; }
      #game-startup button { min-height: 44px; margin-top: 16px; padding: 0 24px; border: 1px solid #ccb780;
        border-radius: 6px; background: #203d32; color: #f4daa0; font: inherit; cursor: pointer; }
      #game-startup button:hover, #game-startup button:focus-visible { background: #355649; }
    </style>

        <p><span role="status">正在准备游戏资源</span> <span id="startup-percent">0%</span></p>
        <small id="startup-detail"></small>
        <button type="button" hidden>重新加载</button>
      </section>
    </div>
    <noscript><style>#game-startup { display: none; }</style></noscript>
